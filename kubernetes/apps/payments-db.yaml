apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-db
  namespace: payments
spec:
  serviceName: payments-db
  replicas: 1
  selector:
    matchLabels:
      app: payments-db
  template:
    metadata:
      labels:
        app: payments-db
    spec:
      containers:
        - name: postgres
          image: postgres:9.6
          args: ["-c", "ssl=off", "-c", "log_connections=off"]
          env:
            - name: POSTGRES_USER
              value: payments
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          hostPath:
            path: /mnt/payments-db
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db-external
  namespace: payments
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  selector:
    app: payments-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:5
          args: ["--protected-mode", "no", "--bind", "0.0.0.0"]
          ports:
            - containerPort: 6379
              hostPort: 6379
