apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: payments
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/server-snippet: |
      location /internal/ {
        proxy_pass http://payments-api.payments.svc.cluster.local:8080/internal/;
      }
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Debug-Backend: $upstream_addr";
spec:
  ingressClassName: nginx
  rules:
    - host: api.acme.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 80
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all
  namespace: payments
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - {}
  egress:
    - {}
---
# Restrict DB access to the API only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-db
  namespace: payments
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
