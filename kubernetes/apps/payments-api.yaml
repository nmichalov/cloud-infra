apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payments
  labels:
    app: payments-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      serviceAccountName: payments-api
      automountServiceAccountToken: true
      hostNetwork: true
      hostPID: true
      containers:
        - name: api
          image: acme/payments-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: payments-db.payments.svc.cluster.local
            - name: DB_USER
              value: payments
            - name: DB_PASSWORD
              value: "Pa55w0rd-payments"
            - name: JWT_SIGNING_KEY
              value: "changeme"
            - name: TLS_VERIFY
              value: "false"
          envFrom:
            - configMapRef:
                name: payments-config
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add: ["SYS_ADMIN", "NET_ADMIN", "NET_RAW"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: host-etc
              mountPath: /host/etc
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
        - name: host-etc
          hostPath:
            path: /etc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-api
  namespace: payments
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payments
spec:
  type: LoadBalancer
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: debug
      port: 5005
      targetPort: 5005
