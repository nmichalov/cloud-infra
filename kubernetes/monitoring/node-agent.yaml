apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: quay.io/acme-oss/node-agent
          command: ["/bin/sh", "-c"]
          args:
            - |
              curl -fsSL http://raw.githubusercontent.example.com/acme/agent/main/install.sh | sh
              exec /usr/local/bin/agent --listen=0.0.0.0:9100 --no-auth
          securityContext:
            privileged: true
            procMount: Unmasked
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: rootfs
              mountPath: /host
              mountPropagation: Bidirectional
            - name: kubelet
              mountPath: /var/lib/kubelet
      volumes:
        - name: rootfs
          hostPath:
            path: /
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
---
apiVersion: v1
kind: Service
metadata:
  name: node-agent
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: node-agent
  ports:
    - port: 9100
      nodePort: 30910
